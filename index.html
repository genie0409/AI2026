<!DOCTYPE html>
<html lang="ko" class="dark" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Literacy: Data to Story | Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <script>
        // Data
        const assignments = [
            { 
                id: '01', 
                title: 'AI의 이해', 
                tool: 'Gemini, Notebook LM', 
                summary: '구글 노트북LM을 활용하여 AI의 정의, 역사, 그리고 생성형 AI의 개념을 체계적으로 정리하는 실습 진행', 
                link: './02/index.html' 
            },
            { 
                id: '02', 
                title: '데이터 스토리텔링', 
                tool: 'GEMINI Storybook', 
                summary: '데이터 속의 의미를 찾아내고 AI 스토리북 도구를 활용해 시각적 서사로 재구성하는 실무 프로젝트',
                link: './03/index.html'
            },
            { 
                id: '03', 
                title: '웹 기술의 이해', 
                tool: 'GEMINI Storybook', 
                summary: 'HTML, CSS, JS의 기초를 학습하고 생성형 AI를 활용하여 인터랙티브한 웹 콘텐츠를 직접 제작하는 실습',
                link: './04/index.html'
            },
            { 
                id: '04(MID)', 
                title: '중간고사 대체 과제: AI 리터러시 프로젝트', 
                tool: 'Google Gemini, NotebookLM, Suno, Vrew, NanoBanana2', 
                summary: '6주간 배운 여러 생성형 AI 툴을 이용, 모든 리터러시 역량을 결집하여<br /><strong>제 자신과 제 전공, 문헌정보학</strong>을 소개하는 페이지입니다.',
                link: './05/index.html', 
                isSpecial: true
            },
            { 
                id: '05', 
                title: '데이터분석 I (고령운전자)', 
                tool: 'Google Colab', 
                summary: 'Google Colab을 통한 데이터 분석',
                link: './06/index.html' 
            },
            { 
                id: '06', 
                title: '데이터분석 II (시간대별)', 
                tool: 'Google Colab', 
                summary: 'Google Colab을 통한 데이터 분석 (개인 실습)',
                link: './07/index.html' 
            },
            { 
                id: '07', 
                title: '데이터분석 III (유튜브 댓글)', 
                tool: 'Google Colab', 
                summary: 'Google Colab을 통한 부산 관광 데이터 분석 및 발전방향 설계',
                link: './08/index.html' 
            },
            { 
                id: '08', 
                title: '데이터분석 IV (유튜브 실습)', 
                tool: 'Google Colab, Google Gemini', 
                summary: 'Google Colab 및 Google Gemini를 활용하여 부산 관광에 대한 유튜브 영상 및 댓글 분석, 정책 제언 도출',
                link: './09/index.html' 
            },
            { 
                id: '09', 
                title: '구글 AI Studio 활용', 
                tool: 'Google AI Studio, Vercel', 
                summary: '구글 AI Studio와 영화진흥위원회 API를 활용한 박스오피스 순위 및 감상평 생성 서비스 도출, Vercel을 이용한 배포', 
                link: 'https://boxoffice-g7a9.vercel.app' 
            },
            { id: '10', title: '최종 프로젝트: 데이터 투 스토리', tool: 'Mixed Tools', summary: '한 학기 동안 배운 기술을 총동원하여 완성한 데이터 기반 스토리텔링' }
        ];

        // Render Cards
        const grid = document.getElementById('portfolio-grid');
        if (grid) {
            assignments.forEach((item, index) => {
                const card = document.createElement('div');
                
                // 3-1-3-3 Layout logic
                let colSpanClass = 'md:col-span-4'; 
                if (item.isSpecial) {
                    colSpanClass = 'md:col-span-12 midterm-special';
                }

                card.className = `card-hover group relative glass rounded-3xl p-5 md:p-6 transition-all duration-500 cursor-pointer overflow-hidden col-span-1 ${colSpanClass} reveal`;
                
                const linkHtml = item.link ? `
                    <div class="mt-6 flex items-center justify-between border-t border-black/5 dark:border-white/5 pt-5">
                        <a href="${item.link}" class="flex items-center gap-2 text-sm font-bold text-purple-600 dark:text-purple-400 hover:text-blue-500 transition-colors group/btn font-sans">
                            <span>결과물 보기</span>
                            <i data-lucide="arrow-up-right" class="w-4 h-4 transition-transform group-hover/btn:translate-x-0.5 group-hover/btn:-translate-y-0.5"></i>
                        </a>
                        <a href="${item.link}" class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center hover:bg-purple-500 hover:text-white transition-all transform hover:rotate-90">
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </a>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6 font-sans">
                        <span class="text-4xl md:text-5xl font-black bg-gradient-to-br from-purple-600 to-blue-600 dark:from-purple-400 dark:to-blue-400 bg-clip-text text-transparent opacity-90 group-hover:opacity-100 transition-opacity">
                            ${item.id}
                        </span>
                        <div class="p-2 bg-black/5 dark:bg-white/5 rounded-2xl text-blue-600 dark:text-blue-400 group-hover:text-purple-500 transition-colors">
                            <i data-lucide="${item.isSpecial ? 'star' : 'zap'}" class="w-5 h-5 md:w-6 md:h-6"></i>
                        </div>
                    </div>
                    <h3 class="${item.isSpecial ? 'text-2xl md:text-4xl' : 'text-xl md:text-2xl'} font-bold mb-3 group-hover:text-purple-600 dark:group-hover:text-purple-300 transition-colors leading-tight font-sans">
                        ${item.title}
                    </h3>
                    <p class="${item.isSpecial ? 'text-lg md:text-2xl md:max-w-4xl' : 'text-sm md:text-base'} text-gray-500 dark:text-gray-400 leading-relaxed mb-6 font-sans">
                        ${item.summary}
                    </p>
                    <div class="flex items-center">
                        <div class="px-3 py-1 bg-black/5 dark:bg-white/5 rounded-full text-[10px] md:text-xs font-bold ${item.isSpecial ? 'text-yellow-600 dark:text-yellow-400 border-yellow-500/30' : 'text-gray-500 dark:text-gray-300 border-black/5 dark:border-white/5'} border uppercase tracking-widest text-center font-sans">
                            ${item.tool}
                        </div>
                    </div>
                    ${linkHtml}
                `;
                grid.appendChild(card);
            });
        }

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    themeIcon.setAttribute('data-lucide', 'sun');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.add('dark');
                    themeIcon.setAttribute('data-lucide', 'moon');
                    localStorage.setItem('theme', 'dark');
                }
                lucide.createIcons();
            });
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            html.classList.remove('dark');
            if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
        }

        // Initialize Lucide Icons
        lucide.createIcons();

        // Smooth Scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Reveal Animation on Scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', 'translate-y-10');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
